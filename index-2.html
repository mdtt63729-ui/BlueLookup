<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dceeff">
<title>Number Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--blue:#1768c8;--ink:#132238;--muted:#5b6b80;--glass:rgba(255,255,255,.68);--line:rgba(255,255,255,.92)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:Roboto,"Google Sans",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 12% 4%,#b8dcff 0,transparent 36%),radial-gradient(ellipse at 92% 23%,#c8e8ff 0,transparent 34%),linear-gradient(145deg,#eaf5ff,#d9ebff 52%,#eef7ff);display:grid;place-items:center;padding:24px 16px}button,input{font:inherit}.page{width:min(100%,540px);margin:auto}.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:34px;font:700 21px "Google Sans",sans-serif;letter-spacing:-.5px}.brand-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:15px;color:white;background:linear-gradient(145deg,#3e91ee,#1554b8);box-shadow:0 8px 22px #1c69be30}.brand-icon svg{width:23px;height:23px}.lookup{padding:clamp(22px,5vw,34px);border:1px solid var(--line);border-radius:32px;background:var(--glass);backdrop-filter:blur(26px) saturate(145%);-webkit-backdrop-filter:blur(26px) saturate(145%);box-shadow:0 22px 60px #285b8d15,inset 0 1px 0 #fff;animation:appear .5s cubic-bezier(.2,.8,.2,1)}h1{text-align:center;font:700 clamp(27px,7vw,34px)/1.15 "Google Sans",sans-serif;letter-spacing:-1px;margin:0 0 10px}.sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 28px}.search{display:flex;gap:10px;flex-direction:column}.field{display:flex;align-items:center;gap:12px;padding:0 17px;height:58px;border-radius:19px;background:rgba(255,255,255,.78);border:1px solid #ffffff;box-shadow:inset 0 1px 2px #2d5e8710;transition:border-color .25s,box-shadow .25s,background .25s}.field:focus-within{background:#fff;border-color:#6aa9f4;box-shadow:0 0 0 4px #3488e51c}.field svg{width:21px;height:21px;flex:none;color:#4c6b8c}.field input{border:0;outline:0;background:transparent;width:100%;min-width:0;color:var(--ink);font-size:16px}.field input::placeholder{color:#7a8ca2}.search-btn{height:56px;border:0;border-radius:19px;background:linear-gradient(135deg,#247be0,#1559bd);color:white;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 7px 17px #1768c82b;transition:transform .22s,box-shadow .22s,filter .22s}.search-btn:hover{filter:brightness(1.04);box-shadow:0 10px 22px #1768c838}.search-btn:active{transform:scale(.98)}.search-btn svg{width:20px;height:20px}.result{display:none;margin-top:20px;overflow:hidden;border:1px solid #ffffff;border-radius:22px;background:rgba(255,255,255,.78);animation:appear .3s ease}.result.show{display:block}.result-head{padding:19px 20px;background:linear-gradient(120deg,#d7eaffc9,#f5faffc9);border-bottom:1px solid #dbeafa}.result-head strong{display:block;font:600 19px "Google Sans",sans-serif;overflow-wrap:anywhere}.result-head span{display:block;margin-top:5px;font-size:12px;color:var(--muted)}.fields{padding:8px 20px 14px;display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.item{padding:13px 0;border-bottom:1px solid #dbe7f3;min-width:0}.item:nth-last-child(-n+2){border-bottom:0}.item span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.item strong{font-size:14px;font-weight:500;line-height:1.4;overflow-wrap:anywhere}.message{display:none;margin-top:18px;text-align:center;padding:14px 16px;border-radius:16px;background:#ffffff9c;border:1px solid #ffffff;color:#425b77;font-size:13px;line-height:1.5}.message.show{display:block}.foot{text-align:center;color:#59718a;font-size:11px;margin:18px 0 0;line-height:1.5}@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(max-width:420px){body{padding:18px 13px}.brand{margin-bottom:25px}.lookup{border-radius:27px;padding:22px 17px}.fields{grid-template-columns:1fr}.item:nth-last-child(2){border-bottom:1px solid #dbe7f3}.item:last-child{border-bottom:0}.sub{margin-bottom:23px}}
</style></head>
<body><main class="page">
  <div class="brand"><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4M8 10.5h5"/></svg></span><span>Number Lookup</span></div>
  <section class="lookup" aria-label="Number lookup"><h1>Look up a number</h1><p class="sub">Enter a demo identifier to view its sample record.</p>
    <form class="search" id="searchForm"><label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg><input id="query" autocomplete="off" placeholder="Enter demo number or ID" aria-label="Demo number or ID" required></label><button class="search-btn" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>Search</button></form>
    <div id="result" class="result" aria-live="polite"></div><div id="message" class="message"></div>
  </section><p class="foot">Demo interface · All records are fictional test data.</p>
</main>
<script>
(()=>{const records=[];const $=id=>document.getElementById(id);const safe=v=>String(v??'Not provided').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(file){try{const r=await fetch(file);if(!r.ok)return;const j=await r.json();(Array.isArray(j)?j:(j.users||j.records||[])).forEach(x=>{if(!records.some(y=>y.id===x.id))records.push(x)})}catch(e){console.warn('Could not load '+file,e)}}
function showMessage(t){$('message').textContent=t;$('message').classList.add('show')}
function search(q){q=q.trim().toLowerCase();if(!q){showMessage('Enter a demo identifier first.');return}const found=records.find(u=>[u.phone,u.id,u.name].some(v=>String(v||'').toLowerCase()===q))||records.find(u=>[u.phone,u.id,u.name].some(v=>String(v||'').toLowerCase().includes(q)));if(!found){$('result').classList.remove('show');showMessage('No matching demo record found. Try a demo ID such as DEMO-001001.');return}$('message').classList.remove('show');const a=found.address||{};const data=[['Demo ID',found.id],['Demo number',found.phone],['Name',found.name],['Email',found.email],['Age',found.age],['Date of birth',found.date_of_birth],['City',a.city],['State',a.state],['Occupation',found.occupation],['Aadhaar placeholder',found.aadhaar||'NOT-A-REAL-AADHAAR']];$('result').innerHTML='<div class="result-head"><strong>'+safe(found.name||'Demo record')+'</strong><span>'+safe(found.id)+' · Fictional sample</span></div><div class="fields">'+data.map(([k,v])=>'<div class="item"><span>'+safe(k)+'</span><strong>'+safe(v)+'</strong></div>').join('')+'</div>';$('result').classList.add('show')}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();search($('query').value)});Promise.all([load('./data.json'),load('./data2.json')]).then(()=>records.sort((a,b)=>String(a.id||'').localeCompare(String(b.id||''),undefined,{numeric:true})));
})();
</script></body></html>
